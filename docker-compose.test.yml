name: leviathan-test

# Test profile — isolated containers for CI and integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d

networks:
  leviathan-test:
    driver: bridge

volumes:
  test_redis_data:
  test_db_data:

services:
  redis-test:
    image: redis:7.2-alpine
    container_name: leviathan-redis-test
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save ""
    ports:
      - "16379:6379"
    networks:
      - leviathan-test
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  timescaledb-test:
    image: timescale/timescaledb:latest-pg16
    container_name: leviathan-timescaledb-test
    environment:
      POSTGRES_USER: leviathan_test
      POSTGRES_PASSWORD: leviathan_test
      POSTGRES_DB: leviathan_test
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "15432:5432"
    networks:
      - leviathan-test
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leviathan_test -d leviathan_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15s

  engine-test:
    image: leviathan-engine:test
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      target: test
    container_name: leviathan-engine-test
    environment:
      - ENGINE_ENV=test
      - ENGINE_LOG_LEVEL=WARNING
      - REDIS_URL=redis://redis-test:6379/0
      - DATABASE_URL=postgresql+asyncpg://leviathan_test:leviathan_test@timescaledb-test:5432/leviathan_test
      - BINANCE_API_KEY=test_key
      - BINANCE_API_SECRET=test_secret
      - OKX_API_KEY=test_key
      - OKX_API_SECRET=test_secret
      - OKX_PASSPHRASE=test_pass
      - BYBIT_API_KEY=test_key
      - BYBIT_API_SECRET=test_secret
    networks:
      - leviathan-test
    depends_on:
      redis-test:
        condition: service_healthy
      timescaledb-test:
        condition: service_healthy
    command: pytest tests/ -v --tb=short --no-header
