[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leviathan-engine"
version = "0.1.0"
description = "LEVIATHAN Global Arbitrage Engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "optuna>=3.6",
    "scipy>=1.13",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "psutil>=5.9",
]

[project.optional-dependencies]
legacy = [
    "ccxt>=4.2",
]
ml = [
    "hmmlearn>=0.3",
    "scikit-learn>=1.4",
]
dex = [
    "web3>=6.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "fakeredis[json]>=2.21",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
