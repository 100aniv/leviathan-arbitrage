# =============================================================================
# LEVIATHAN Engine — Dynaconf Profile Settings
# Switch profiles via ENV_FOR_DYNACONF=shadow|live|test|backtest
# Priority: environment variable > .env > settings.toml > hardcoded default
# =============================================================================

[default]
# WS-1: execution_mode / data_mode removed from here — engine.json "mode" is authoritative.
# Use [test], [backtest] profiles to override (via ENV_FOR_DYNACONF).
engine_env = "dev"
min_edge_bps = 5
kill_switch_enabled = true
min_price_usd = 0.1
max_rollback_threshold = 0.02
engine_log_level = "INFO"
engine_api_port = 8000

[shadow]
data_mode = "shadow"
min_edge_bps = 0
max_position_usd = 5000
shadow_depth_fraction = 1.0
shadow_max_trade_size = 100

[live]
execution_mode = "live"
data_mode = "real_authenticated"
min_edge_bps = 5
max_position_usd = 5000

[test]
engine_env = "test"
execution_mode = "paper"
data_mode = "synthetic"
engine_log_level = "WARNING"

[backtest]
engine_env = "test"
execution_mode = "paper"
data_mode = "synthetic"
