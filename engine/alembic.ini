# Alembic configuration for LEVIATHAN engine

[alembic]
script_location = alembic
prepend_sys_path = .

# SQLAlchemy async URL — override via DATABASE_URL env var or alembic/env.py
sqlalchemy.url = postgresql+asyncpg://leviathan:leviathan@localhost:5432/leviathan

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
