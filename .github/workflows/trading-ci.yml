name: Trading Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leviathan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        run: |
          cd engine
          pip install -r requirements.txt

      - name: Wiring check (dead component detection)
        run: |
          cd engine
          python -c "
          from src.execution.dedup import DeduplicationGate
          from src.execution.margin_tracker import MarginTracker
          from src.execution.stranded import StrandedPositionTracker
          from src.execution.trade_reconciler import TradeReconciler
          from src.strategies.futures_futures import FuturesFuturesStrategy
          assert hasattr(FuturesFuturesStrategy, 'pop_exit_requests'), 'pop_exit_requests missing'
          print('WIRING OK: all components importable and wired')
          "

      - name: Run unit tests
        env:
          ENGINE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leviathan_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd engine
          python -m pytest tests/ -x --tb=short -q

      - name: Rollback dedup check
        run: |
          cd engine
          python -c "
          from src.execution.executor import AtomicExecutor
          assert hasattr(AtomicExecutor, '__init__'), 'AtomicExecutor OK'
          import inspect
          src = inspect.getsource(AtomicExecutor.__init__)
          assert '_rollback_attempted' in src, '_rollback_attempted not in __init__'
          print('ROLLBACK DEDUP OK')
          "
