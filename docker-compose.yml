name: leviathan

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

networks:
  leviathan:
    driver: bridge

volumes:
  redis_data:
  timescaledb_data:
  wal_archive:
  prometheus_data:
  grafana_data:
  loki_data:
  db_backups:
  promtail_positions:

services:
  # ---------------------------------------------------------------------------
  # Python Arbitrage Engine
  # ---------------------------------------------------------------------------
  engine:
    image: leviathan-engine:latest
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    container_name: leviathan-engine
    restart: unless-stopped
    env_file: .env
    environment:
      # Override .env localhost values with Docker service hostnames
      DB_HOST: timescaledb
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://leviathan:${POSTGRES_PASSWORD}@timescaledb:5432/leviathan
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-leviathan-redis-secret}
      SHADOW_DISABLED_STRATEGIES: ${SHADOW_DISABLED_STRATEGIES:-}
    volumes:
      - ./docker/init.sql:/app/docker/init.sql:ro
    ports:
      - "8000:8000"   # REST API + Prometheus metrics + WebSocket (/ws, /ws/feed)
      # 8001 removed: ENGINE_WS_PORT=8001 is dead config, WS served on 8000
    networks:
      - leviathan
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis 7 — Streams + Position Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: leviathan-redis
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-leviathan-redis-secret}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-leviathan-redis-secret}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - leviathan
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-leviathan-redis-secret} --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis Exporter — Prometheus metrics for Redis (Amendment 1C)
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: leviathan-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-leviathan-redis-secret}
    ports:
      - "9121:9121"
    networks:
      - leviathan
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL 16 + TimescaleDB extension)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: leviathan-timescaledb
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 1.0
    environment:
      POSTGRES_USER: leviathan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: leviathan
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - leviathan
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
      - ./infra/postgres/postgresql.conf:/etc/postgresql/conf.d/wal.conf:ro
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f"
      - -c
      - archive_timeout=300
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - wal_keep_size=512MB
      - -c
      - checkpoint_timeout=10min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leviathan -d leviathan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Next.js Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    image: leviathan-dashboard:latest
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      target: production
    container_name: leviathan-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENGINE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - "3000:3000"
    networks:
      - leviathan
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: leviathan-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - leviathan
    volumes:
      - prometheus_data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Alertmanager — alert routing to Telegram (US-138)
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: leviathan-alertmanager
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        # envsubst not available in Alpine — use sed for 3-bot token replacement
        sed \
          -e "s|INFRA_TELEGRAM_BOT_TOKEN_PLACEHOLDER|$${INFRA_TELEGRAM_BOT_TOKEN}|g" \
          -e "s|TRADE_TELEGRAM_BOT_TOKEN_PLACEHOLDER|$${TRADE_TELEGRAM_BOT_TOKEN}|g" \
          -e "s|DEV_TELEGRAM_BOT_TOKEN_PLACEHOLDER|$${DEV_TELEGRAM_BOT_TOKEN}|g" \
          -e "s|chat_id: 0|chat_id: $${INFRA_TELEGRAM_CHAT_ID}|g" \
          /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - leviathan
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Nginx — TLS termination + reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: leviathan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - leviathan
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ip-whitelist.conf:/etc/nginx/ip-whitelist.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      engine:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Bot Gateway — DevBot + InfraBot + MonitorDaemon 독립 실행 (Phase S20-C)
  # ---------------------------------------------------------------------------
  bot-gateway:
    image: leviathan-engine:latest
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    container_name: leviathan-bot-gateway
    restart: unless-stopped
    command: ["python", "-m", "src.bot_gateway"]
    env_file: .env
    environment:
      # DevBot
      DEV_TELEGRAM_BOT_TOKEN: ${DEV_TELEGRAM_BOT_TOKEN}
      DEV_TELEGRAM_CHAT_ID: ${DEV_TELEGRAM_CHAT_ID}
      DEV_TELEGRAM_ENABLED: ${DEV_TELEGRAM_ENABLED:-true}
      # InfraBot
      INFRA_TELEGRAM_BOT_TOKEN: ${INFRA_TELEGRAM_BOT_TOKEN}
      INFRA_TELEGRAM_CHAT_ID: ${INFRA_TELEGRAM_CHAT_ID}
      INFRA_TELEGRAM_ENABLED: ${INFRA_TELEGRAM_ENABLED:-true}
      # TradeBot disabled (runs inside engine)
      TRADE_TELEGRAM_ENABLED: "false"
      # Engine URL for InfraBot /health
      ENGINE_URL: http://engine:8000
      # MonitorDaemon (integrated into bot-gateway)
      MONITOR_INTERVAL_SEC: "300"
      DB_HOST: timescaledb
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://leviathan:${POSTGRES_PASSWORD}@timescaledb:5432/leviathan
    volumes:
      - .:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - leviathan
    # No depends_on — runs independently of engine!
    healthcheck:
      test: ["CMD", "python", "-c", "import src.bot_gateway; print('ok')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Auto-Tuner — 매주 일요일 02:00 UTC 파라미터 자동 최적화
  # ---------------------------------------------------------------------------
  auto-tuner:
    image: leviathan-engine:latest
    container_name: leviathan-auto-tuner
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: timescaledb
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://leviathan:${POSTGRES_PASSWORD}@timescaledb:5432/leviathan
      TUNER_N_TRIALS: "100"
      TUNER_DATA_SOURCE: ${TUNER_DATA_SOURCE:-timescaledb}
    command: ["python", "-m", "src.tuning.scheduled_tuner"]
    networks:
      - leviathan
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import src.tuning.scheduled_tuner; print('ok')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # DB Backup — daily pg_dump with 7-day retention
  # ---------------------------------------------------------------------------
  db-backup:
    image: timescale/timescaledb:latest-pg16
    container_name: leviathan-db-backup
    restart: "no"
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: leviathan
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: leviathan
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
    volumes:
      - db_backups:/backups
      - ./scripts/backup_db.sh:/scripts/backup_db.sh:ro
    entrypoint: ["/bin/bash", "/scripts/backup_db.sh"]
    networks:
      - leviathan
    depends_on:
      timescaledb:
        condition: service_healthy
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Loki — Log Aggregation (US-121)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: leviathan-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - leviathan
    volumes:
      - loki_data:/loki
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Promtail — Log Shipper (US-121)
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    container_name: leviathan-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    environment:
      - DOCKER_API_VERSION=1.41
    networks:
      - leviathan
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/log/promtail
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # WAL Backup — continuous WAL archiving + weekly verify (US-122)
  # ---------------------------------------------------------------------------
  wal-backup:
    image: timescale/timescaledb:latest-pg16
    container_name: leviathan-wal-backup
    restart: "no"
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: leviathan
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: leviathan
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
    volumes:
      - db_backups:/backups
      - wal_archive:/backups/wal_archive:ro
      - ./infra/backup/wal-backup.sh:/scripts/wal-backup.sh:ro
    entrypoint: ["/bin/bash", "/scripts/wal-backup.sh", "backup"]
    networks:
      - leviathan
    depends_on:
      timescaledb:
        condition: service_healthy
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: leviathan-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-leviathan}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
    ports:
      - "3001:3001"
    networks:
      - leviathan
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
