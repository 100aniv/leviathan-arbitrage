# =============================================================================
# LEVIATHAN Redis Configuration
# Redis 7.x — Position Cache + Streams event bus
# =============================================================================

# --- Network ---
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- General ---
daemonize no
loglevel notice
logfile ""
databases 16

# --- Persistence ---
# RDB snapshots (keep for crash recovery fallback)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) — disabled; position durability handled by PostgreSQL WAL (Amendment 1B)
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec

# --- Memory ---
# CRITICAL (Amendment 1C): noeviction policy — Redis must NEVER silently drop position data.
# Any OOM condition surfaces as a write error, which triggers the in-process HALT flag (Amendment 1D).
maxmemory 8gb
maxmemory-policy noeviction

# Memory sampling for eviction checks (unused with noeviction, kept for safety)
maxmemory-samples 10

# --- Lazy freeing ---
lazyfree-lazy-eviction no
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush no

# --- Streams ---
# Enable Streams for the event bus (order book updates, signals, position changes)
# stream-node-max-bytes 4096: each stream node can hold up to 4KB
# stream-node-max-entries 100: or up to 100 entries per node
stream-node-max-bytes 4096
stream-node-max-entries 100

# --- Slow Log ---
# 10ms threshold
slowlog-log-slower-than 10000
slowlog-max-len 256

# --- Latency Monitoring ---
# 10ms threshold for latency events
latency-monitor-threshold 10
latency-tracking yes
latency-tracking-info-percentiles 50 99 99.9

# --- Active Defrag ---
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# --- Client Output Buffer Limits ---
# Normal clients
client-output-buffer-limit normal 0 0 0
# Replica clients
client-output-buffer-limit replica 256mb 64mb 60
# Pub/Sub clients (used for internal signalling)
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Key Notification (for Streams consumer group coordination) ---
notify-keyspace-events ""

# --- Connection Limits ---
maxclients 1000

# --- Disabled commands (security hardening) ---
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# Uncomment above in production once application is stable.
