global:
  resolve_timeout: 5m

route:
  receiver: 'telegram-infra'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'telegram-infra'
      repeat_interval: 1h
    - match_re:
        alertname: '.*trade.*|.*pnl.*|.*strategy.*'
      match:
        severity: warning
      receiver: 'telegram-trade'
      repeat_interval: 2h
    - match_re:
        alertname: '.*deploy.*|.*build.*'
      receiver: 'telegram-dev'
      repeat_interval: 4h

receivers:
  - name: 'telegram-infra'
    telegram_configs:
      - bot_token: 'INFRA_TELEGRAM_BOT_TOKEN_PLACEHOLDER'
        chat_id: 0
        parse_mode: 'HTML'
        message: |
          {{ range .Alerts }}
          <b>{{ .Labels.severity | toUpper }}</b>: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: 'telegram-trade'
    telegram_configs:
      - bot_token: 'TRADE_TELEGRAM_BOT_TOKEN_PLACEHOLDER'
        chat_id: 0
        parse_mode: 'HTML'
        message: |
          {{ range .Alerts }}
          <b>{{ .Labels.severity | toUpper }}</b>: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: 'telegram-dev'
    telegram_configs:
      - bot_token: 'DEV_TELEGRAM_BOT_TOKEN_PLACEHOLDER'
        chat_id: 0
        parse_mode: 'HTML'
        message: |
          {{ range .Alerts }}
          <b>{{ .Labels.severity | toUpper }}</b>: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
