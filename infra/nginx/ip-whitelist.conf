# =============================================================================
# LEVIATHAN — nginx IP whitelist template
#
# By default all IPs are allowed. Uncomment and adjust the blocks below to
# restrict access. Restart nginx after changes:
#   docker compose restart nginx
# =============================================================================

# --- Default: allow all ------------------------------------------------------
# Remove or comment out this line when activating a whitelist below.
allow all;

# --- Example: private networks only ------------------------------------------
# allow 10.0.0.0/8;
# allow 172.16.0.0/12;
# allow 192.168.0.0/16;
# deny  all;

# --- Example: specific office IPs + VPN range --------------------------------
# allow 203.0.113.10;      # Office A static IP
# allow 203.0.113.20;      # Office B static IP
# allow 10.8.0.0/24;       # WireGuard VPN clients
# deny  all;

# --- Example: single trusted server ------------------------------------------
# allow 198.51.100.42;
# deny  all;
