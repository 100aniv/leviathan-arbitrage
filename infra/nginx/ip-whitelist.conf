# =============================================================================
# LEVIATHAN — nginx IP whitelist
# RFC-1918 private ranges only (US-125)
# Restart nginx after changes: docker compose restart nginx
# =============================================================================

# LEVIATHAN IP Whitelist — RFC-1918 private ranges only
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 127.0.0.1;
allow ::1;
deny all;
