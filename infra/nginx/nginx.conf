# =============================================================================
# LEVIATHAN — nginx reverse proxy configuration
# TLS termination, WebSocket proxying, rate limiting, security headers
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m  rate=30r/s;

# ---------------------------------------------------------------------------
# Gzip compression
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenges (future production use)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — requires a CA-signed cert; disabled for self-signed dev certs.
    # Enable in production by uncommenting and providing ssl_trusted_certificate.
    # ssl_stapling        on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # --- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http://localhost:8000 https://localhost:8000; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # --- IP whitelisting (include generated allow/deny rules) ----------------
    include /etc/nginx/ip-whitelist.conf;

    # --- Proxy timeouts -------------------------------------------------------
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Common proxy headers (used by all upstream blocks)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # WebSocket — /ws  (generic engine WS endpoint)
    # -------------------------------------------------------------------------
    location /ws {
        limit_req zone=ws_limit burst=50 nodelay;

        proxy_pass         http://engine:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # WebSocket — /ws/feed  (market-data feed)
    # -------------------------------------------------------------------------
    location /ws/feed {
        limit_req zone=ws_limit burst=50 nodelay;

        proxy_pass         http://engine:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # Prometheus metrics — /metrics
    # -------------------------------------------------------------------------
    location /metrics {
        # Restrict metrics to internal networks only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://engine:8000;
    }

    # -------------------------------------------------------------------------
    # Engine health check — /health
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://engine:8000;
    }

    # -------------------------------------------------------------------------
    # REST API — /api/
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://engine:8000;

        # Strip the /api prefix if the engine serves routes at /
        # Comment out the next line if the engine already expects /api/ prefix
        # rewrite ^/api/(.*)$ /$1 break;
    }

    # -------------------------------------------------------------------------
    # Grafana — /grafana/
    # -------------------------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3001/;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Grafana needs the base URL rewritten
        sub_filter_once off;
        sub_filter 'href="/' 'href="/grafana/';
        sub_filter 'src="/'  'src="/grafana/';
    }

    # -------------------------------------------------------------------------
    # Dashboard (Next.js) — /  (catch-all, must be last)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://dashboard:3000;

        # Next.js hot-reload WebSocket (dev mode)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

# Map for WebSocket connection header upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
