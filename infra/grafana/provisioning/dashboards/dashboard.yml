# =============================================================================
# Grafana Dashboard Provisioning — LEVIATHAN
# =============================================================================

apiVersion: 1

providers:
  - name: leviathan-dashboards
    orgId: 1
    folder: LEVIATHAN
    folderUid: leviathan-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
