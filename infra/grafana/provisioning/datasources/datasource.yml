# =============================================================================
# Grafana Datasource Provisioning — LEVIATHAN
# =============================================================================

apiVersion: 1

datasources:
  # ---------------------------------------------------------------------------
  # Prometheus — primary metrics source
  # ---------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus-leviathan
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
    editable: false
