# =============================================================================
# PostgreSQL WAL Archiving Configuration — LEVIATHAN PITR (US-122)
# =============================================================================
# Include this via docker-compose volume mount.
# TimescaleDB image applies its own defaults; these override WAL settings only.

# --- WAL Archiving ---
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# --- WAL Settings ---
max_wal_size = 1GB
min_wal_size = 80MB
wal_keep_size = 512MB

# --- Checkpoint ---
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# --- Logging ---
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
